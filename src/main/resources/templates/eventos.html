<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roller Speed - Eventos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<section class="section-rs">
    <div class="container" style="max-width: 760px;">
        <h1 class="mb-4">Eventos de la escuela</h1>

        <div class="evento-card" th:each="evento : ${eventos}">
            <div class="evento-fecha">
                <div class="dia" th:text="${evento.dia}">00</div>
                <div class="mes" th:text="${evento.mes}">Mes</div>
            </div>
            <div>
                <span class="evento-tag" th:text="${evento.categoria}">Categoría</span>
                <div class="evento-titulo" th:text="${evento.titulo}">Título</div>
                <div class="evento-detalle" th:text="${evento.detalle}">Detalle</div>
            </div>
        </div>

    </div>
</section>

<footer class="footer-rs text-center">
    <p class="mb-0">&copy; 2026 Roller Speed</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
